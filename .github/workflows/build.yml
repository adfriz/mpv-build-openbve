name: build-libmpv-lgpl

# Release infra for OpenBVE video-texture libs. Stable pins only (VERSIONS);
# no tracking of master/nightly anywhere by design.
on:
  workflow_dispatch:
    inputs:
      mpv_version:
        description: "Override MPV_VERSION (stable tag, e.g. v0.41.0)"
        required: false
        default: ""
      ffmpeg_version:
        description: "Override FFMPEG_VERSION (stable, e.g. 9.0.1)"
        required: false
        default: ""
      create_release:
        description: "Publish GitHub release with 3 separate zips"
        required: false
        default: false
        type: boolean
      tag_name:
        description: "Tag name for manual release (required when create_release=true)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      CC: ccache gcc
      CXX: ccache g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply version overrides
        run: |
          if [ -n "${{ inputs.mpv_version }}" ]; then sed -i -E "s/^MPV_VERSION=.*/MPV_VERSION=${{ inputs.mpv_version }}/" VERSIONS; fi
          if [ -n "${{ inputs.ffmpeg_version }}" ]; then sed -i -E "s/^FFMPEG_VERSION=.*/FFMPEG_VERSION=${{ inputs.ffmpeg_version }}/" VERSIONS; fi
          if [ -n "${{ inputs.ffmpeg_version }}" ]; then sed -i -E "s|^FFMPEG_URL=.*|FFMPEG_URL=https://ffmpeg.org/releases/ffmpeg-${{ inputs.ffmpeg_version }}.tar.xz|" VERSIONS; fi
          cat VERSIONS
      - name: Restore ccache (auto-saved at job end, even on failure)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ hashFiles('VERSIONS') }}
          restore-keys: |
            ccache-linux-
      - name: Install deps
        run: |
          mkdir -p .ccache
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config python3 python3-pip git curl zip patchelf ccache \
            libfreetype6-dev libfontconfig1-dev libfribidi-dev libharfbuzz-dev \
            libxxhash-dev \
            libgl-dev libepoxy-dev libva-dev libvdpau-dev
      - name: Install Meson from pip (apt meson 0.61 < mpv 0.41 minimum 1.3.0)
        run: |
          pip3 install -U meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          meson --version
      - name: Build
        run: bash scripts/build-linux.sh
      - name: Verify LGPL + stable source
        run: bash scripts/verify-lgpl.sh linux staging/linux
      - name: Smoke test
        run: python3 scripts/smoke-opengl.py staging/linux/x64/libmpv.so.2
      - name: Package (separate zip)
        run: bash scripts/package.sh linux staging/linux dist
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-linux-x64
          path: dist/libmpv-lgpl-linux-x64.tar.gz*

  build-windows:
    # Cross-compile Windows DLL. Host MUST be Arch (same as upstream's own
    # CI): the engine is developed against rolling host tools and dep
    # configures fail on Ubuntu 22.04's older toolchain.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: ghcr.io/archlinux/archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Apply version overrides
        run: |
          if [ -n "${{ inputs.mpv_version }}" ]; then sed -i -E "s/^MPV_VERSION=.*/MPV_VERSION=${{ inputs.mpv_version }}/" VERSIONS; fi
          if [ -n "${{ inputs.ffmpeg_version }}" ]; then sed -i -E "s/^FFMPEG_VERSION=.*/FFMPEG_VERSION=${{ inputs.ffmpeg_version }}/" VERSIONS; fi
          if [ -n "${{ inputs.ffmpeg_version }}" ]; then sed -i -E "s|^FFMPEG_URL=.*|FFMPEG_URL=https://ffmpeg.org/releases/ffmpeg-${{ inputs.ffmpeg_version }}.tar.xz|" VERSIONS; fi
          cat VERSIONS
      - name: Restore toolchain cache (gcc cross, slowest part of cold builds)
        uses: actions/cache@v4
        with:
          # NOTE: key is arch-container-specific on purpose. Toolchain installs
          # embed absolute paths and are NOT relocatable across layouts
          # (a cache saved by ubuntu-native runs must never restore here).
          path: build/winbuild/build64/install
          key: win-toolchain-archcontainer-x64-gcc-v3-${{ hashFiles('VERSIONS') }}
      - name: Install host deps
        run: |
          mkdir -p build/winbuild/build64/install
          pacman -Syu --noconfirm
          # NOTE: wget + 7zip are hard requirements of the engine (cppwinrt
          # install step downloads Windows.winmd via wget). Same set as
          # upstream's own Arch CI (they also add mimalloc/7zip).
          # NOTE: do NOT install mimalloc/jemalloc here. The engine's top
          # CMakeLists auto-detects /usr/lib/libmimalloc.so and bakes
          # LD_PRELOAD=<that> into build64/exec for EVERY toolchain step;
          # the run that added it died one stage earlier (crt-configure)
          # than all runs without it. Empty LD_PRELOAD is the safe default.
          pacman -S --noconfirm --needed git ninja cmake meson python nasm yasm gperf ragel pkgconf curl wget unzip zip 7zip perl
          meson --version
          cmake --version | head -1
          gcc --version | head -1
      - name: Build libmpv-2.dll (LGPL, gcc cross)
        run: bash scripts/build-windows-lgpl.sh
      - name: Verify LGPL + stable source
        run: bash scripts/verify-lgpl.sh windows staging/windows
      - name: Package (separate zip)
        run: bash scripts/package.sh windows staging/windows dist
      - name: Collect failure logs
        if: always()
        run: |
          mkdir -p winlogs
          LOGS=$(find build/winbuild/build64 \( -path "*stamp/*.log" -o -name "config.log" -o -name "meson-log.txt" \) -type f 2>/dev/null | sort)
          echo "$LOGS" > winlogs/files.txt || true
          # NOTE: *-err.log files print FIRST (they hold the actual failure),
          # then toolchain config.log files (they hold the failed compile
          # test, e.g. crt-configure's header check), then everything else.
          # The old head/print caps used to bury both.
          { echo "$LOGS" | grep -E -- "-err\.log$" || true; echo "$LOGS" | grep -E -- "toolchain/.*config\.log$" || true; echo "$LOGS" | grep -vE -- "-err\.log$|toolchain/.*config\.log$" || true; } | while IFS= read -r f; do
            n=15; case "$f" in *-err.log|*/config.log) n=80;; esac
            { echo "===== $f"; tail -n "$n" "$f"; echo; }
          done > winlogs/tails.txt || true
          wc -l winlogs/tails.txt || true
      - name: Print log tails on failure
        if: failure()
        run: head -c 60000 winlogs/tails.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winbuild-logs
          path: winlogs/
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-windows-x64
          path: dist/libmpv-lgpl-windows-x64.zip*

  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      CC: ccache clang
      CXX: ccache clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply version overrides
        run: |
          if [ -n "${{ inputs.mpv_version }}" ]; then sed -i -E "s/^MPV_VERSION=.*/MPV_VERSION=${{ inputs.mpv_version }}/" VERSIONS; fi
          if [ -n "${{ inputs.ffmpeg_version }}" ]; then sed -i -E "s/^FFMPEG_VERSION=.*/FFMPEG_VERSION=${{ inputs.ffmpeg_version }}/" VERSIONS; fi
          if [ -n "${{ inputs.ffmpeg_version }}" ]; then sed -i -E "s|^FFMPEG_URL=.*|FFMPEG_URL=https://ffmpeg.org/releases/ffmpeg-${{ inputs.ffmpeg_version }}.tar.xz|" VERSIONS; fi
          cat VERSIONS
      - name: Restore ccache (auto-saved at job end, even on failure)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-intel-${{ hashFiles('VERSIONS') }}
          restore-keys: |
            ccache-macos-intel-
      - name: Install build tools (NOT brew ffmpeg — GPL, must build from stable source)
        run: |
          mkdir -p .ccache
          # No bottle support left for Intel: keep the formula list minimal and
          # never let brew upgrade unrelated dependents from source (very slow).
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          export HOMEBREW_NO_ENV_HINTS=1
          brew update
          brew install meson ninja pkg-config nasm ccache \
            freetype fribidi harfbuzz fontconfig libepoxy libplacebo
      - name: Build (x86_64 only)
        run: arch -x86_64 bash scripts/build-macos-intel.sh
      - name: Verify LGPL + Intel-only
        run: bash scripts/verify-lgpl.sh macos-intel staging/macos-intel
      - name: Smoke test
        run: python3 scripts/smoke-opengl.py staging/macos-intel/x64/libmpv.2.dylib
      - name: Package (separate zip)
        run: bash scripts/package.sh macos-intel staging/macos-intel dist
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-macos-intel
          path: dist/libmpv-lgpl-macos-intel.tar.gz*

  release:
    needs: [build-linux, build-windows, build-macos-intel]
    # Manual dispatch without tag_name would fail inside gh-release with a
    # cryptic "no tag" error; guard here instead with a clear skip.
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.create_release == true && inputs.tag_name != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum libmpv-lgpl-*.zip libmpv-lgpl-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          # On tag pushes inputs.tag_name is empty; fall back to the pushed tag.
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/libmpv-lgpl-windows-x64.zip
            dist/libmpv-lgpl-linux-x64.tar.gz
            dist/libmpv-lgpl-macos-intel.tar.gz
            dist/SHA256SUMS.txt
          body: |
            LGPL-only libmpv for OpenBVE video-texture (PR #1333).
            Each platform is a SEPARATE archive.
            See runtime.json + ffmpeg-configure.txt inside each archive for
            mpv/ffmpeg stable versions + exact configure flags.
